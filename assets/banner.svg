<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">

  <!-- Background -->
  <rect width="1200" height="300" fill="#0d0d12"/>

  <!-- Subtle vertical rule separator -->
  <line x1="300" y1="48" x2="300" y2="252" stroke="#1e1e2e" stroke-width="1"/>

  <!-- === LOGO MARK (left side, scaled down) === -->

  <!-- Container chip -->
  <rect x="68" y="68" width="164" height="164" rx="20" ry="20" fill="#12121a"/>

  <!-- Bar 1 -->
  <rect x="92" y="168" width="34" height="40" rx="5" ry="5" fill="#f1f5f9"/>

  <!-- Bar 2 -->
  <rect x="134" y="136" width="34" height="72" rx="5" ry="5" fill="#f1f5f9"/>

  <!-- Bar 3 -->
  <rect x="176" y="102" width="34" height="106" rx="5" ry="5" fill="#f1f5f9" opacity="0.35"/>

  <!-- Traversal path -->
  <polyline
    points="109,168  151,136  193,102"
    fill="none"
    stroke="#22d3ee"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.9"
  />
  <circle cx="109" cy="168" r="3.5" fill="#22d3ee"/>
  <circle cx="151" cy="136" r="3.5" fill="#22d3ee"/>
  <circle cx="193" cy="102" r="3.5" fill="#22d3ee" opacity="0.5"/>

  <!-- === WORDMARK + TAGLINE (right side) === -->

  <!-- "BitStride" -->
  <text
    x="338"
    y="168"
    font-family="ui-sans-serif, system-ui, -apple-system, Helvetica Neue, sans-serif"
    font-size="72"
    font-weight="700"
    letter-spacing="-2"
    fill="#f8fafc"
  >BitStride</text>

  <!-- Tagline -->
  <text
    x="340"
    y="206"
    font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="17"
    fill="#475569"
    letter-spacing="0.5"
  >two-stage quantized HNSW traversal · SIFT1M</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="292" width="1200" height="3" fill="#22d3ee" opacity="0.5"/>

</svg>
