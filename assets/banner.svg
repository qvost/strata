<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0B111D"/>
      <stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>

    <!-- Glowing Accents -->
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FFA3" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00FFA3" stop-opacity="0"/>
    </radialGradient>

    <!-- Node & Line Gradients -->
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2E66FF" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="lineGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E66FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00FFA3" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="880" height="260" rx="14" fill="url(#bgGradient)"/>
  <rect width="878" height="258" x="1" y="1" rx="13" fill="none" stroke="#1B263B" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Subtle Architectural Grid -->
  <g opacity="0.12" stroke="#4FACFE" stroke-width="0.8">
    <line x1="40" y1="0" x2="40" y2="260"/>
    <line x1="120" y1="0" x2="120" y2="260"/>
    <line x1="200" y1="0" x2="200" y2="260"/>
    <line x1="280" y1="0" x2="280" y2="260"/>
    <line x1="0" y1="65" x2="880" y2="65"/>
    <line x1="0" y1="130" x2="880" y2="130"/>
    <line x1="0" y1="195" x2="880" y2="195"/>
  </g>

  <!-- Left: Multi-Scale Isometric Graph Emblem -->
  <g transform="translate(48, 26)">
    <!-- Ambient Glow behind Focal Convergence -->
    <circle cx="110" cy="120" r="85" fill="url(#glowGreen)"/>
    <circle cx="70" cy="55" r="65" fill="url(#glowCyan)"/>

    <!-- Layer 2 (Top Sparse Highway) -->
    <g id="layer-highway" opacity="0.85">
      <line x1="40" y1="45" x2="110" y2="30" stroke="#00F2FE" stroke-width="1.8" stroke-dasharray="3,3"/>
      <line x1="110" y1="30" x2="160" y2="55" stroke="#00F2FE" stroke-width="1.8"/>

      <circle cx="40" cy="45" r="4.5" fill="#00F2FE" filter="url(#shadowGlow)"/>
      <circle cx="110" cy="30" r="5.5" fill="#FFFFFF" stroke="#00F2FE" stroke-width="2"/>
      <circle cx="160" cy="55" r="4.5" fill="#00F2FE"/>
    </g>

    <!-- Inter-layer Descent Links (Stage 1 BQ POPCNT Traversal) -->
    <g id="interlayer-hops" opacity="0.6">
      <line x1="110" y1="30" x2="80" y2="95" stroke="url(#lineGrad1)" stroke-width="2"/>
      <line x1="160" y1="55" x2="145" y2="105" stroke="url(#lineGrad1)" stroke-width="1.5" stroke-dasharray="2,2"/>
    </g>

    <!-- Layer 1 (Intermediate Layer) -->
    <g id="layer-inter">
      <line x1="30" y1="105" x2="80" y2="95" stroke="#2E66FF" stroke-width="1.5"/>
      <line x1="80" y1="95" x2="145" y2="105" stroke="#2E66FF" stroke-width="1.5"/>
      <line x1="145" y1="105" x2="185" y2="120" stroke="#2E66FF" stroke-width="1.2"/>

      <circle cx="30" cy="105" r="4" fill="#2E66FF"/>
      <circle cx="80" cy="95" r="5" fill="#00E5FF" filter="url(#shadowGlow)"/>
      <circle cx="145" cy="105" r="4.5" fill="#2E66FF"/>
      <circle cx="185" cy="120" r="3.5" fill="#2E66FF"/>
    </g>

    <!-- Layer 0 Convergence (Stage 2 SQ8 ADC Fine Re-ranking) -->
    <g id="layer-0-dense">
      <line x1="50" y1="165" x2="80" y2="95" stroke="url(#lineGrad2)" stroke-width="1.8"/>
      <line x1="50" y1="165" x2="115" y2="155" stroke="#00FFA3" stroke-width="2"/>
      <line x1="115" y1="155" x2="155" y2="175" stroke="#00FFA3" stroke-width="1.5"/>
      <line x1="115" y1="155" x2="135" y2="130" stroke="#00FFA3" stroke-width="1.2"/>
      <line x1="80" y1="180" x2="115" y2="155" stroke="#2E66FF" stroke-width="1.2"/>

      <circle cx="50" cy="165" r="4.5" fill="#2E66FF"/>
      <circle cx="155" cy="175" r="4" fill="#2E66FF"/>
      <circle cx="135" cy="130" r="3.5" fill="#00FFA3"/>
      <circle cx="80" cy="180" r="3.5" fill="#1B263B" stroke="#00FFA3" stroke-width="1.2"/>

      <!-- Focal Target Rings -->
      <circle cx="115" cy="155" r="14" fill="none" stroke="#00FFA3" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
      <circle cx="115" cy="155" r="9" fill="none" stroke="#00FFA3" stroke-width="1.5" opacity="0.8"/>
      <circle cx="115" cy="155" r="5.5" fill="#00FFA3" filter="url(#shadowGlow)"/>
    </g>
  </g>

  <!-- Right: Branding & Typography -->
  <g transform="translate(295, 62)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="224" height="22" rx="4" fill="#131F33" stroke="#1D304E" stroke-width="1"/>
    <text x="8" y="15" fill="#00F2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.2">SYSTEMS &amp; VECTOR SEARCH</text>

    <!-- Main Title: BitStride -->
    <text x="0" y="68" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      BitStride
    </text>

    <!-- Technical Tagline -->
    <text x="0" y="96" fill="#8F9FB5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" letter-spacing="0.2">
      Asymmetric, Cache-Resident Two-Stage HNSW Traversal Engine
    </text>

    <!-- Empirical Proof Badges -->
    <g transform="translate(0, 122)">
      <!-- Badge 1: L3 Cache Reduction -->
      <g>
        <rect x="0" y="0" width="168" height="26" rx="5" fill="#0E1E2E" stroke="#00F2FE" stroke-width="1" stroke-opacity="0.4"/>
        <circle cx="12" cy="13" r="3.5" fill="#00F2FE"/>
        <text x="22" y="17" fill="#E2EDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">
          -95.0% L3 Cache Misses
        </text>
      </g>

      <!-- Badge 2: Recall Retention -->
      <g transform="translate(178, 0)">
        <rect x="0" y="0" width="164" height="26" rx="5" fill="#0A241C" stroke="#00FFA3" stroke-width="1" stroke-opacity="0.4"/>
        <circle cx="12" cy="13" r="3.5" fill="#00FFA3"/>
        <text x="22" y="17" fill="#E2EDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">
          98.8% Recall Preserved
        </text>
      </g>

      <!-- Badge 3: Hardware SIMD -->
      <g transform="translate(352, 0)">
        <rect x="0" y="0" width="176" height="26" rx="5" fill="#141B2D" stroke="#2E66FF" stroke-width="1" stroke-opacity="0.4"/>
        <circle cx="12" cy="13" r="3.5" fill="#2E66FF"/>
        <text x="22" y="17" fill="#E2EDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">
          AVX2 / FMA + POPCNT
        </text>
      </g>
    </g>
  </g>
</svg>
